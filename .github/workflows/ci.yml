name: CI

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 21
      - name: Run tests
        run: |
          sed -i 's/\r$//' gradlew
          chmod +x gradlew
          ./gradlew test --no-daemon
